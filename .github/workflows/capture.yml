name: fuyao-capture

# 抓取同花顺热榜，生成当日 Excel 与排名时序数据（Bump Chart 用）
#
# 触发方式：
#   1. schedule（GitHub 自带定时，仅作兜底 —— 实测每天只跑 3~4 次）
#   2. workflow_dispatch（由外部定时器调用，主驱动 —— 每 15 分钟触发一次）
#
# 前提：Settings → Secrets and variables → Actions → 新建 secret：FUYAO_API_KEY
#
# 注意：脚本直接用仓库里的 scripts/*.mjs，不再用 heredoc 现场生成。
#       以前 heredoc 会覆盖仓库文件，导致改了 scripts/capture.mjs 却不生效。
on:
  schedule:
    - cron: "5 * * * *" # 兜底，每小时第 5 分钟
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fuyao-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取热榜 + 生成数据
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
          TZ: Asia/Shanghai
          KEEP_DAYS: "400"
        run: node scripts/capture.mjs

      - name: 提交结果
        run: |
          git config user.name "fuyao-bot"
          git config user.email "fuyao-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化（可能本小时已抓过），跳过提交"
          else
            git commit -m "capture: $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M%z)"
            git push
          fi
