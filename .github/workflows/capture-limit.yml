name: fuyao-limit-capture

# 【一键版】连板情绪：只需在仓库新建 .github/workflows/capture-limit.yml，把本文件全部内容粘贴进去
# 无需任何 secret（东方财富公开接口）；每小时抓一次连板梯队/炸板/情绪分并存仓
on:
  schedule:
    - cron: "8 * * * *"   # UTC，北京时间每小时 08 分，与主热榜(整点)错开
  workflow_dispatch: {}

permissions:
  contents: write          # 需 Settings → Actions → General → Workflow permissions = Read and write

concurrency:
  group: fuyao-limit-capture
  cancel-in-progress: false

jobs:
  capture-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 写入连板抓取脚本（内联，零外部依赖）
        run: |
          mkdir -p scripts/lib data/limit
          echo "" | base64 -d > scripts/lib/limit-pool.cjs
          echo "" | base64 -d > scripts/capture-limit.mjs
          wc -c scripts/lib/limit-pool.cjs scripts/capture-limit.mjs

      - name: 抓取连板情绪
        env:
          TZ: Asia/Shanghai
          KEEP_DAYS: "3650"
        run: node scripts/capture-limit.mjs

      - name: 提交结果
        run: |
          git config user.name "fuyao-bot"
          git config user.email "fuyao-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化（可能本小时已抓过），跳过提交"
          else
            git commit -m "limit: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
